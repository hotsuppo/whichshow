<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4efe7">
<title>関西か？関東か？</title>
<style>
:root{--ks:#e4573d;--kt:#2878bf;--ink:#172033;--paper:#fffdf9;--muted:#687385}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{background:linear-gradient(135deg,#fff1e8 0 50%,#e9f3ff 50%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button{font:inherit}.screen{display:none;min-height:100dvh;width:100%;max-width:760px;margin:auto;padding:18px}.screen.active{display:flex;flex-direction:column}.panel{background:#fffdf9f5;border-radius:28px;box-shadow:0 18px 50px #1f2d3d26}.start{justify-content:center;text-align:center;gap:20px}.hero{padding:34px 24px}.eyebrow{font-size:18px;font-weight:800;color:var(--muted);letter-spacing:.08em}h1{font-size:clamp(38px,9vw,68px);line-height:1.2;margin:12px 0 18px}.rule{font-size:clamp(21px,5vw,30px);font-weight:800;line-height:1.7;margin:0}.directions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 14px}.direction{color:#fff;border-radius:20px;padding:18px 8px;font-size:clamp(22px,5vw,30px);font-weight:900}.direction small{display:block;font-size:15px}.left{--side:var(--ks)}.right{--side:var(--kt)}.direction,.side-label{background:var(--side)}.note{font-size:17px;color:var(--muted);line-height:1.6}.primary,.secondary,.danger{border:0;border-radius:18px;min-height:68px;padding:12px 22px;font-size:24px;font-weight:900;cursor:pointer}.primary{background:#22354d;color:#fff;box-shadow:0 8px 20px #22354d40}.secondary{background:#e9eef4;color:#22354d}.danger{background:#fff0ee;color:#a9392b}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{padding:0;overflow:hidden;position:relative;background:linear-gradient(90deg,#e4573d1a,#fffffff2 45% 55%,#2878bf1a);touch-action:none}.hud{height:74px;padding:12px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#ffffffe8;border-bottom:1px solid #dfe5ec;z-index:5}.hud strong{font-size:21px}.hud .time{text-align:center;font-size:26px;font-weight:900}.hud .score{text-align:right}.time.warning{color:#c33525;animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}.playfield{position:relative;height:calc(100dvh - 74px);min-height:450px;overflow:hidden}.background-kanji{position:absolute;top:48%;font-size:clamp(150px,42vw,290px);font-weight:1000;line-height:1;opacity:.13;transform:translateY(-50%);pointer-events:none;user-select:none;z-index:0}.background-kanji.left{left:-.04em;color:var(--ks)}.background-kanji.right{right:-.04em;color:var(--kt)}.side-label{position:absolute;top:18px;padding:10px 13px;color:#fff;font-size:18px;font-weight:900;border-radius:14px;z-index:1;box-shadow:0 5px 15px #0002}.side-label.left{left:12px}.side-label.right{right:12px}.card{position:absolute;z-index:2;left:50%;top:56px;width:min(88%,620px);min-height:310px;max-height:calc(100% - 115px);transform:translateX(-50%);background:var(--paper);border-radius:26px;padding:24px;box-shadow:0 14px 36px #1f2d3d38;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform,top;overflow:hidden}.card.dragging{cursor:grabbing;transition:none!important}.card.fly{transition:transform .24s ease-out,opacity .24s ease-out!important}.meta{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:10px;text-align:center}.question{font-size:clamp(24px,5.5vw,38px);line-height:1.45;font-weight:900;text-align:center}.q-image{display:block;width:100%;max-height:min(39dvh,330px);object-fit:contain;border-radius:16px;margin-bottom:15px;pointer-events:none}.swipe-mark{position:absolute;top:50%;font-size:54px;font-weight:1000;opacity:0;transform:translateY(-50%);pointer-events:none;z-index:3}.swipe-mark.left{left:17px;color:var(--ks)}.swipe-mark.right{right:17px;color:var(--kt)}.feedback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:min(42vw,280px);font-weight:1000;text-shadow:0 8px 25px #0003;z-index:9;pointer-events:none}.feedback.show{display:flex;animation:pop .36s ease-out}.feedback.ok{color:#159447}.feedback.ng{color:#d2382b}@keyframes pop{0%{transform:scale(.55);opacity:0}75%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.end{gap:16px;padding-bottom:30px}.result-panel{padding:25px;text-align:center}.result-panel h2{font-size:38px;margin:0 0 18px}.score-big{font-size:clamp(48px,13vw,84px);font-weight:1000;line-height:1;color:#22354d}.score-big small{font-size:24px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.stat{background:#f0f4f8;border-radius:16px;padding:14px;font-size:17px}.stat strong{display:block;font-size:28px}.section{padding:20px}.section h3{font-size:25px;margin:0 0 14px}.rank-list{margin:0;padding:0;list-style:none}.rank-list li{display:grid;grid-template-columns:45px 1fr auto;gap:8px;padding:12px 5px;border-bottom:1px solid #e3e7eb;font-size:18px}.history{display:grid;gap:13px}.history-item{border:1px solid #dce2e8;border-radius:16px;padding:15px;background:#fff}.history-item.ok{border-left:8px solid #159447}.history-item.ng{border-left:8px solid #d2382b}.history-head,.history-q{font-weight:900;font-size:18px;margin-bottom:8px}.history-q{line-height:1.5}.history-a{margin:9px 0;color:#495568}.history-exp{line-height:1.65}.history-img{display:block;max-width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin:10px auto}details summary{cursor:pointer;font-size:23px;font-weight:900;padding:4px 0 12px}.empty{color:var(--muted);text-align:center;padding:12px}@media(max-height:650px){.card{top:35px;min-height:250px;padding:18px}.question{font-size:24px}.q-image{max-height:230px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.selectBack{display:block;box-sizing:border-box;text-align:center;margin:12px auto 0;padding:15px 18px;max-width:420px;width:100%;border-radius:16px;background:#e7edf4;color:#18304a;text-decoration:none;font-size:clamp(19px,2.6vw,25px);font-weight:800;min-height:56px}
.end .button-row #homeButton{order:2;grid-column:1/-1}.end .button-row #retryButton{grid-column:1/-1}.end .button-row .resultBack{order:1;grid-column:1/-1;display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:56px;padding:15px 18px;border-radius:16px;background:#e7edf4;color:#18304a;text-decoration:none;font-size:clamp(19px,2.6vw,25px);font-weight:800}
</style>
</head>
<body>
<main id="startScreen" class="screen start active"><section class="panel hero"><div class="eyebrow">全534問・120秒チャレンジ</div><h1>関西か？<br>関東か？</h1><p class="rule">問題カードを左右にスワイプして答えよう！</p><div class="directions"><div class="direction left"><small>← 左へ</small>関西</div><div class="direction right"><small>右へ →</small>関東</div></div><p class="note">同じ問題は1回のゲーム中に重複しません。<br>カードが下まで落ちると時間切れです。</p></section><button id="startButton" class="primary">ゲームスタート</button><button id="showRankingButton" class="secondary">ランキングを見る</button><a class="selectBack" href="index.html">問題選択に戻る</a></main>
<main id="gameScreen" class="screen game" aria-live="polite"><header class="hud"><strong>問題 <span id="questionCount">1</span></strong><div id="timeDisplay" class="time">120秒</div><strong class="score"><span id="scoreDisplay">0</span>問正解</strong></header><div id="playfield" class="playfield"><div class="background-kanji left" aria-hidden="true">西</div><div class="background-kanji right" aria-hidden="true">東</div><div class="side-label left">← 関西</div><div class="side-label right">関東 →</div><article id="questionCard" class="card"></article><div id="leftMark" class="swipe-mark left">関西</div><div id="rightMark" class="swipe-mark right">関東</div><div id="feedback" class="feedback"></div></div></main>
<main id="endScreen" class="screen end"><section class="panel result-panel"><h2>結果発表</h2><div class="score-big"><span id="finalScore">0</span><small>問正解</small></div><div class="stats"><div class="stat">出題数<strong id="finalCount">0</strong></div><div class="stat">正答率<strong id="finalRate">0%</strong></div></div></section><div class="button-row"><button id="retryButton" class="primary">もう一度</button><a class="resultBack" href="index.html">問題選択に戻る</a><button id="homeButton" class="secondary">最初へ</button></div><section class="panel section"><h3>端末内ランキング TOP10</h3><ol id="rankingList" class="rank-list"></ol><button id="resetRankingButton" class="danger">ランキングを消去</button></section><section class="panel section"><details><summary>問題と解説を見る（<span id="historyCount">0</span>問）</summary><div id="historyList" class="history"></div></details></section></main>
<script src="kansai_data_1.js"></script><script src="kansai_data_2.js"></script><script src="kansai_data_3.js"></script><script>(() => {
'use strict';
const GAME_SECONDS=120,RANKING_KEY='kansai_kanto_rank_v1',FALL_SPEED=.24;
const questions=window.KANSAI_KANTO_DATA?.questions||[],$=id=>document.getElementById(id);
const screens=['startScreen','gameScreen','endScreen'],card=$('questionCard'),playfield=$('playfield'),feedback=$('feedback'),leftMark=$('leftMark'),rightMark=$('rightMark');
let deck=[],current=null,history=[],score=0,secondsLeft=GAME_SECONDS,startedAt=0,timerId=0,fallFrame=0,lastFallTime=0,cardTop=56,answering=false,drag=null;

function showScreen(id){screens.forEach(name=>$(name).classList.toggle('active',name===id));window.scrollTo(0,0)}
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function image(q,className='q-image'){return q.image?.file?`<img class="${className}" src="${esc(q.image.file)}" alt="${esc(q.topic||'問題画像')}">`:''}

function startGame(){
 if(!questions.length){alert('問題データを読み込めませんでした。questions.jsを同じフォルダに置いてください。');return}
 cancelAnimationFrame(fallFrame);clearInterval(timerId);deck=shuffle(questions);current=null;history=[];score=0;secondsLeft=GAME_SECONDS;startedAt=Date.now();answering=false;updateHud();showScreen('gameScreen');nextQuestion();
 timerId=setInterval(()=>{secondsLeft--;updateHud();if(secondsLeft<=0)finishGame()},1000)
}
function updateHud(){$('questionCount').textContent=Math.max(1,history.length+1);$('scoreDisplay').textContent=score;$('timeDisplay').textContent=`${Math.max(0,secondsLeft)}秒`;$('timeDisplay').classList.toggle('warning',secondsLeft<=10)}
function nextQuestion(){
 cancelAnimationFrame(fallFrame);if(secondsLeft<=0||!deck.length){finishGame();return}
 current=deck.pop();answering=false;drag=null;cardTop=innerHeight<650?35:56;card.className='card';card.style.top=`${cardTop}px`;card.style.opacity='1';card.style.transform='translateX(-50%) rotate(0deg)';card.innerHTML=`${image(current)}<div class="meta">${esc(current.subcategory)} ・ ${esc(current.id)}</div><div class="question">${esc(current.question)}</div>`;leftMark.style.opacity='0';rightMark.style.opacity='0';updateHud();lastFallTime=performance.now();fallFrame=requestAnimationFrame(fallCard)
}
function fallCard(now){
 if(answering||!current)return;const elapsed=Math.min(40,now-lastFallTime);lastFallTime=now;if(!drag){cardTop+=FALL_SPEED*(elapsed/16.67);card.style.top=`${cardTop}px`}
 const limit=playfield.clientHeight-Math.min(card.offsetHeight*.3,100);if(cardTop+card.offsetHeight>=limit){submitAnswer(null,0);return}fallFrame=requestAnimationFrame(fallCard)
}
function submitAnswer(choice,direction){
 if(answering||!current)return;answering=true;cancelAnimationFrame(fallFrame);const q=current,ok=choice===q.answer;if(ok)score++;history.push({question:q,choice,ok});updateHud();
 const fly=direction||(choice==='関西'?-1:choice==='関東'?1:0);if(fly){card.classList.add('fly');card.style.transform=`translateX(${fly*150}%) rotate(${fly*18}deg)`;card.style.opacity='0'}else card.style.opacity='.25';
 feedback.textContent=ok?'○':'×';feedback.className=`feedback show ${ok?'ok':'ng'}`;setTimeout(()=>{feedback.className='feedback';current=null;nextQuestion()},560)
}
function finishGame(){
 if(!$('gameScreen').classList.contains('active'))return;clearInterval(timerId);cancelAnimationFrame(fallFrame);answering=true;current=null;const total=history.length,rate=total?Math.round(score/total*100):0,elapsed=Math.max(1,Math.round((Date.now()-startedAt)/1000));saveRanking({score,total,rate,elapsed,date:new Date().toISOString()});$('finalScore').textContent=score;$('finalCount').textContent=total;$('finalRate').textContent=`${rate}%`;$('historyCount').textContent=total;renderRanking();renderHistory();showScreen('endScreen')
}
function getRanking(){try{const value=JSON.parse(localStorage.getItem(RANKING_KEY)||'[]');return Array.isArray(value)?value:[]}catch(_){return[]}}
function saveRanking(result){const ranking=[...getRanking(),result].sort((a,b)=>b.score-a.score||b.rate-a.rate||a.elapsed-b.elapsed).slice(0,10);try{localStorage.setItem(RANKING_KEY,JSON.stringify(ranking))}catch(_){}}
function renderRanking(){const ranking=getRanking();$('rankingList').innerHTML=ranking.length?ranking.map((x,i)=>`<li><b>${i+1}位</b><span>${x.score}問正解（${x.rate}%）</span><span>${x.total}問</span></li>`).join(''):'<li class="empty">記録はまだありません</li>'}
function renderHistory(){$('historyList').innerHTML=history.map((item,i)=>{const q=item.question,choice=item.choice||'時間切れ';return `<article class="history-item ${item.ok?'ok':'ng'}"><div class="history-head">${i+1}. ${item.ok?'○ 正解':'× 不正解'}</div>${image(q,'history-img')}<div class="history-q">${esc(q.question)}</div><div class="history-a">あなたの回答：${esc(choice)} ／ 正解：<b>${esc(q.answer)}</b></div><div class="history-exp">${esc(q.explanation)}</div></article>`}).join('')||'<div class="empty">出題履歴はありません</div>'}
function openRanking(){history=[];$('finalScore').textContent='—';$('finalCount').textContent='—';$('finalRate').textContent='—';$('historyCount').textContent='0';$('historyList').innerHTML='<div class="empty">ゲーム終了後に問題と解説を表示します</div>';renderRanking();showScreen('endScreen')}

function pointerDown(e){if(answering||!current)return;card.setPointerCapture?.(e.pointerId);drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:0,y:0};card.classList.add('dragging')}
function pointerMove(e){if(!drag||drag.id!==e.pointerId||answering)return;drag.x=e.clientX-drag.startX;drag.y=e.clientY-drag.startY;card.style.transform=`translateX(calc(-50% + ${drag.x}px)) translateY(${drag.y*.15}px) rotate(${drag.x/22}deg)`;const strength=Math.min(1,Math.abs(drag.x)/120);leftMark.style.opacity=drag.x<0?String(strength):'0';rightMark.style.opacity=drag.x>0?String(strength):'0'}
function pointerUp(e){if(!drag||drag.id!==e.pointerId||answering)return;const distance=drag.x;drag=null;card.classList.remove('dragging');const threshold=Math.max(50,innerWidth*.13);if(Math.abs(distance)>=threshold)submitAnswer(distance<0?'関西':'関東',distance<0?-1:1);else{card.style.transition='transform .18s ease-out';card.style.transform='translateX(-50%) rotate(0deg)';leftMark.style.opacity='0';rightMark.style.opacity='0';setTimeout(()=>card.style.transition='',190)}}
card.addEventListener('pointerdown',pointerDown);card.addEventListener('pointermove',pointerMove);card.addEventListener('pointerup',pointerUp);card.addEventListener('pointercancel',pointerUp);
document.addEventListener('keydown',e=>{if(!$('gameScreen').classList.contains('active')||answering)return;if(e.key==='ArrowLeft')submitAnswer('関西',-1);if(e.key==='ArrowRight')submitAnswer('関東',1)});
$('startButton').addEventListener('click',startGame);$('retryButton').addEventListener('click',startGame);$('showRankingButton').addEventListener('click',openRanking);$('homeButton').addEventListener('click',()=>showScreen('startScreen'));$('resetRankingButton').addEventListener('click',()=>{if(confirm('この端末のランキングをすべて消去しますか？')){localStorage.removeItem(RANKING_KEY);renderRanking()}})
})();
</script>
</body></html>
